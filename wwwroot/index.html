<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <!-- Add Employee -->
        <div class="employee-container">

            <h2>Add Employee</h2>

            <form id="employeeForm">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter employee name"
                    required
                >

                <label for="department">Department</label>
                <input
                    type="text"
                    id="department"
                    placeholder="Enter department"
                    required
                >

                <label for="salary">Salary</label>
                <input
                    type="number"
                    id="salary"
                    placeholder="Enter salary"
                    required
                >

                <button type="submit">
                    Add Employee
                </button>

            </form>

            <p id="message"></p>

        </div>


        <!-- Employee List -->
        <div class="employee-container">

            <h2>Employees</h2>

            <button onclick="loadEmployees()">
                Refresh Employees
            </button>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">
                </tbody>

            </table>

        </div>


        <!-- S3 Upload -->
        <div class="upload-container">

            <h2>Upload File to S3</h2>

            <form id="uploadForm">

                <input
                    type="file"
                    id="fileInput"
                    required
                >

                <button type="submit">
                    Upload to S3
                </button>

            </form>

            <p id="uploadMessage"></p>

        </div>

    </div>

    <script src="/app.js"></script>

</body>
</html>
